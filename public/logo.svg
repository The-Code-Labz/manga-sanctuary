<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rounded background, deep night -->
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1A1530"/>
      <stop offset="100%" stop-color="#0A0820"/>
    </radialGradient>
    <!-- Neon purple for the arch -->
    <linearGradient id="neonPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C18BFF"/>
      <stop offset="100%" stop-color="#7B3FE4"/>
    </linearGradient>
    <!-- Soft magenta-pink for the inner glow -->
    <radialGradient id="magentaGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#FF7DB8" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#F2498F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F2498F" stop-opacity="0"/>
    </radialGradient>
    <!-- Golden accent for the keystone star -->
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#FFC933"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Soft pink halo behind the arch -->
  <circle cx="256" cy="240" r="180" fill="url(#magentaGlow)"/>

  <!-- Sanctuary arch: a stylized doorway, glowing purple -->
  <path d="M 124 420 L 124 240 Q 124 132 256 132 Q 388 132 388 240 L 388 420"
        fill="none" stroke="url(#neonPurple)" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner arch echo for depth -->
  <path d="M 156 420 L 156 244 Q 156 162 256 162 Q 356 162 356 244 L 356 420"
        fill="none" stroke="#A864FF" stroke-width="2" opacity="0.55"/>

  <!-- Open book resting at the base of the archway -->
  <g>
    <!-- Left page -->
    <path d="M 152 408 Q 152 304 256 304 L 256 408 Z" fill="#F4EDFF" opacity="0.96"/>
    <!-- Right page -->
    <path d="M 360 408 Q 360 304 256 304 L 256 408 Z" fill="#F4EDFF" opacity="0.96"/>
    <!-- Spine fold shadow -->
    <line x1="256" y1="304" x2="256" y2="408" stroke="#A864FF" stroke-width="2" opacity="0.5"/>
    <!-- Left page lines -->
    <g stroke="#A864FF" stroke-width="2.2" stroke-linecap="round" opacity="0.55">
      <line x1="178" y1="334" x2="240" y2="334"/>
      <line x1="178" y1="352" x2="240" y2="352"/>
      <line x1="178" y1="370" x2="226" y2="370"/>
      <line x1="178" y1="388" x2="240" y2="388"/>
    </g>
    <!-- Right page lines -->
    <g stroke="#A864FF" stroke-width="2.2" stroke-linecap="round" opacity="0.55">
      <line x1="272" y1="334" x2="334" y2="334"/>
      <line x1="272" y1="352" x2="334" y2="352"/>
      <line x1="272" y1="370" x2="320" y2="370"/>
      <line x1="272" y1="388" x2="334" y2="388"/>
    </g>
  </g>

  <!-- Keystone: a small four-point golden star at the apex of the arch -->
  <path d="M 256 100 L 263 120 L 283 120 L 267 132 L 273 152 L 256 140 L 239 152 L 245 132 L 229 120 L 249 120 Z"
        fill="url(#gold)"/>
  <circle cx="256" cy="126" r="3.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
